[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "motionlab-gait-windows"
version = "0.4.0"
description = "Local Windows desktop application for research gait video analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mediapipe==1.0.1",
  "opencv-contrib-python==5.0.0.93",
  "PySide6==6.11.2",
  "scipy==1.18.1",
]

[project.scripts]
motionlab-gait = "motionlab_gait.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
